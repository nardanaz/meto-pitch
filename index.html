<title>MeTo · Pitch BAC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MeTo — Pitch interactivo para Business Angels' Club del IAE Business School.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.6/babel.min.js"></script>

<style>
  /* Layout concept: editorial scroll-based deck. Alternating paper/ink/violet full-width sections,
     content lives in a 12-col max-1200px grid centered. Hero + Vision are "sealed" branded moments. */

  :root {
    /* Brand (brandbook v1.0 oficial) */
    --violet: #6B3AFF;
    --violet-deep: #2C0E8A;
    --violet-strong: #4A1FD9;
    --violet-soft: #B59CFF;
    --coral: #FF4D6D;
    --coral-soft: #FFE4E9;
    --ink: #0E0E14;
    --ink-soft: #4A4A55;
    --ink-muted: #888892;
    --paper: #FAFAF7;
    --white: #FFFFFF;
    --border: #EEEEF0;
    --success: #1A7F3C;
    --gold: #C9A227;

    /* Semantic tokens (light default) */
    --bg: var(--paper);
    --surface: var(--white);
    --surface-elev: var(--white);
    --fg: var(--ink);
    --fg-soft: var(--ink-soft);
    --fg-muted: var(--ink-muted);
    --accent: var(--violet);
    --accent-soft: var(--violet-soft);
    --highlight: var(--coral);
    --highlight-soft: var(--coral-soft);
    --border-color: var(--border);
    --shadow-sm: 0 2px 8px rgba(14, 14, 20, 0.06);
    --shadow-md: 0 6px 24px rgba(14, 14, 20, 0.10);
    --shadow-lg: 0 14px 48px rgba(14, 14, 20, 0.14);

    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #05050A;
      --surface: #11111A;
      --surface-elev: #1A1A25;
      --fg: #F5F5F7;
      --fg-soft: #B5B5BF;
      --fg-muted: #6E6E78;
      --border-color: #2A2A35;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 14px 48px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #05050A;
    --surface: #11111A;
    --surface-elev: #1A1A25;
    --fg: #F5F5F7;
    --fg-soft: #B5B5BF;
    --fg-muted: #6E6E78;
    --border-color: #2A2A35;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 14px 48px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  * { box-sizing: border-box; }

  h1, h2, h3, h4, h5 {
    text-wrap: balance;
    margin: 0;
    letter-spacing: -0.025em;
  }

  p { margin: 0; }

  /* ─── Nav ──────────────────────────────────────────────────────────────── */
  .nav {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px max(20px, env(safe-area-inset-left, 0px)) 14px max(20px, env(safe-area-inset-right, 0px));
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    background: color-mix(in oklab, var(--bg) 78%, transparent);
    border-bottom: 1px solid color-mix(in oklab, var(--border-color) 50%, transparent);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 51;
    background: var(--bg);
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
  .nav-brand .logo { width: 28px; height: 28px; }
  .nav-ctx { color: var(--fg-muted); font-size: 12px; font-weight: 500; }
  .nav-sections { display: none; gap: 24px; font-size: 13px; font-weight: 500; }
  @media (min-width: 820px) { .nav-sections { display: flex; } }
  .nav-sections a { color: var(--fg-soft); text-decoration: none; transition: color .15s; }
  .nav-sections a:hover { color: var(--accent); }
  .theme-toggle {
    background: transparent; border: 1px solid var(--border-color);
    color: var(--fg-soft); padding: 6px 10px; border-radius: 999px; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .theme-toggle:hover { color: var(--fg); border-color: var(--fg-muted); }

  /* ─── Sections ────────────────────────────────────────────────────────── */
  section {
    padding-block: clamp(60px, 10vh, 120px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    scroll-margin-top: 70px;
  }
  .section-inner { max-width: 1180px; margin: 0 auto; }
  .section-paper { background: var(--paper); color: var(--ink); }
  .section-ink { background: var(--ink); color: var(--white); }
  .section-ink .fg-soft { color: #B5B5BF; }
  .section-violet { background: var(--violet); color: var(--white); }
  .section-violet .fg-soft { color: var(--violet-soft); }

  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--coral); margin-bottom: 18px; display: inline-block;
  }
  .section-ink .eyebrow, .section-violet .eyebrow { color: var(--coral); }

  h2.section-h {
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.035em;
    margin-bottom: 20px;
  }
  .section-h + .section-lede {
    font-size: clamp(16px, 1.6vw, 20px);
    line-height: 1.5;
    color: var(--fg-soft);
    max-width: 60ch;
    margin-bottom: 48px;
  }
  .section-ink .section-lede, .section-violet .section-lede { color: rgba(255,255,255,0.78); }

  /* ─── Hero ────────────────────────────────────────────────────────────── */
  .hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(170deg, var(--violet-deep) 0%, var(--violet) 55%, var(--violet-strong) 100%);
    color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
    padding-block: 100px 60px;
  }
  .hero-glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4; pointer-events: none; }
  .hero-glow.a { width: 500px; height: 500px; background: var(--violet-soft); top: -150px; right: -80px; }
  .hero-glow.b { width: 400px; height: 400px; background: var(--coral); bottom: -100px; left: -100px; opacity: 0.25; }

  .hero-isotype { width: 108px; height: 108px; position: relative; z-index: 1; margin-bottom: 32px; }

  .hero h1 {
    font-size: clamp(56px, 11vw, 120px);
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.055em;
    position: relative; z-index: 1;
  }
  .hero-sub {
    font-size: 12px; font-weight: 600; letter-spacing: 0.42em;
    opacity: 0.78; margin-top: 10px; position: relative; z-index: 1;
  }
  .hero-tagline {
    font-size: clamp(18px, 2.4vw, 28px);
    font-weight: 400;
    margin-top: 32px;
    max-width: 20ch;
    opacity: 0.92;
    position: relative; z-index: 1;
  }
  .hero-context {
    margin-top: 48px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    position: relative; z-index: 1;
    backdrop-filter: blur(10px);
  }
  .hero-founder {
    margin-top: 20px; font-size: 11px; opacity: 0.72; letter-spacing: 0.08em;
    position: relative; z-index: 1;
  }
  .hero-scroll {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.65); font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 6px;
    animation: bounce 2s infinite;
  }
  @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }

  /* ─── Isotype motion (respiración) ────────────────────────────────────── */
  @keyframes dot-move {
    0%, 100% { transform: translate(26px, 26px); }
    20% { transform: translate(10px, 10px); }
    40% { transform: translate(42px, 10px); }
    60% { transform: translate(42px, 42px); }
    80% { transform: translate(10px, 42px); }
  }
  .isotype-dot { animation: dot-move 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) {
    .isotype-dot { animation: none; }
  }

  /* ─── Problem cards ──────────────────────────────────────────────────── */
  .cards-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .problem-card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 28px;
    box-shadow: var(--shadow-sm);
    transition: transform .25s, box-shadow .25s, border-color .25s;
  }
  .problem-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--violet-soft); }
  .problem-card .icon { font-size: 32px; margin-bottom: 14px; display: block; }
  .problem-card h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .problem-card p { font-size: 14px; color: var(--fg-soft); line-height: 1.5; }

  /* Big stat */
  .big-stat { font-size: clamp(72px, 14vw, 180px); font-weight: 900; line-height: 0.95; letter-spacing: -0.055em; color: var(--coral); }
  .big-stat-label { font-size: 15px; color: var(--fg-soft); max-width: 36ch; margin-top: 8px; }

  /* ─── Insight (ink section) ──────────────────────────────────────────── */
  .insight-headline {
    font-size: clamp(56px, 10vw, 112px);
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.045em;
    margin: 40px 0 48px;
  }
  .insight-headline .accent { color: var(--coral); }
  .forces { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; margin-top: 40px; }
  .force h4 { color: var(--coral); font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  .force p { color: rgba(255,255,255,0.84); font-size: 15px; line-height: 1.5; }

  /* ─── Solution: 3 steps + phone ──────────────────────────────────────── */
  .solution-grid { display: grid; grid-template-columns: 1fr; gap: 48px; align-items: center; }
  @media (min-width: 820px) { .solution-grid { grid-template-columns: 1.1fr 1fr; } }
  .step { display: flex; gap: 20px; margin-bottom: 32px; align-items: flex-start; }
  .step-num {
    flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
    background: var(--coral); color: white; display: grid; place-items: center;
    font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .step h3 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .step p { color: var(--fg-soft); font-size: 15px; line-height: 1.5; }

  /* ─── Interactive phone demo ─────────────────────────────────────────── */
  .phone-wrap { display: flex; justify-content: center; align-items: center; min-height: 580px; }
  .phone {
    position: relative;
    width: 280px;
    height: 580px;
    background: #1a1a24;
    border-radius: 46px;
    padding: 10px;
    box-shadow:
      0 0 0 2px #0A0A12,
      0 40px 80px rgba(107, 58, 255, 0.3),
      0 20px 40px rgba(14, 14, 20, 0.25);
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 16px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px; background: #0A0A12; border-radius: 20px; z-index: 4;
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: var(--paper);
  }
  .phone-screen img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    opacity: 0;
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(1.02);
  }
  .phone-screen img.active { opacity: 1; transform: scale(1); }

  .demo-controls {
    display: flex; gap: 8px; justify-content: center;
    margin-top: 28px;
  }
  .demo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--border-color);
    border: none; cursor: pointer; transition: all .2s;
  }
  .demo-dot:hover { background: var(--fg-muted); }
  .demo-dot.active { background: var(--accent); width: 26px; border-radius: 10px; }

  /* ─── Market (TAM/SAM/SOM) ───────────────────────────────────────────── */
  .market-grid { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: center; }
  @media (min-width: 820px) { .market-grid { grid-template-columns: 1fr 1.1fr; } }
  .bubbles { position: relative; width: 100%; aspect-ratio: 1; max-width: 460px; margin: 0 auto; }
  .bubble { position: absolute; top: 50%; left: 50%; border-radius: 50%; transform: translate(-50%, -50%); }
  .bubble.tam { width: 100%; height: 100%; background: color-mix(in oklab, var(--violet-soft) 60%, transparent); border: 2px solid color-mix(in oklab, var(--violet) 40%, transparent); }
  .bubble.sam { width: 62%; height: 62%; background: color-mix(in oklab, var(--violet) 50%, transparent); border: 2px solid var(--violet); }
  .bubble.som { width: 28%; height: 28%; background: var(--coral); border: 2px solid var(--coral); color: white; display: grid; place-items: center; font-size: 13px; font-weight: 800; text-align: center; }
  .market-item + .market-item { margin-top: 28px; }
  .market-item .size { font-size: 32px; font-weight: 900; letter-spacing: -0.02em; }
  .market-item .size.tam { color: var(--violet); }
  .market-item .size.sam { color: var(--violet-deep); }
  .market-item .size.som { color: var(--coral); }
  .market-item .name { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 4px; }
  .market-item .desc { font-size: 14px; color: var(--fg-soft); line-height: 1.5; margin-top: 6px; max-width: 44ch; }

  /* ─── Competition quadrant ───────────────────────────────────────────── */
  .quadrant {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    box-shadow: var(--shadow-sm);
  }
  .quadrant-axis { position: absolute; background: var(--border-color); }
  .quadrant-axis.v { width: 1px; top: 5%; bottom: 5%; left: 50%; }
  .quadrant-axis.h { height: 1px; left: 5%; right: 5%; top: 50%; }
  .axis-label { position: absolute; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); }
  .axis-label.top { top: 10px; left: 50%; transform: translateX(-50%); }
  .axis-label.bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }
  .axis-label.left { left: 10px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: center; white-space: nowrap; }
  .axis-label.right { right: 10px; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: center; white-space: nowrap; }
  .competitor { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; transform: translate(-50%, -50%); }
  .competitor .bubble { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: white; font-weight: 800; font-size: 13px; box-shadow: var(--shadow-sm); position: relative; top: 0; left: 0; transform: none; }
  .competitor .label { font-size: 11px; font-weight: 600; color: var(--fg-soft); white-space: nowrap; }
  .competitor.meto .bubble { width: 76px; height: 76px; background: var(--violet); font-size: 15px; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(107, 58, 255, 0.4); } 50% { box-shadow: 0 0 0 16px rgba(107, 58, 255, 0); } }
  .diffs { list-style: none; padding: 0; margin: 0; }
  .diffs li { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border-color); font-size: 15px; color: var(--fg); }
  .diffs li:last-child { border-bottom: none; }
  .diffs li::before { content: "→"; color: var(--coral); font-weight: 700; flex: 0 0 20px; }

  /* ─── Business model streams ─────────────────────────────────────────── */
  .streams { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .stream {
    padding: 32px 26px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 300px;
    position: relative;
    overflow: hidden;
  }
  .stream-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; padding: 4px 10px; border-radius: 999px; display: inline-block; width: fit-content; }
  .stream h3 { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
  .stream .when { font-size: 12px; font-weight: 600; opacity: 0.75; }
  .stream p { font-size: 14px; line-height: 1.5; opacity: 0.9; flex: 1; }
  .stream .pct { font-size: 15px; font-weight: 800; margin-top: 12px; }
  .stream.freemium { background: var(--violet-soft); color: var(--ink); }
  .stream.freemium .stream-tag { background: var(--violet); color: white; }
  .stream.pro { background: var(--violet); color: white; }
  .stream.pro .stream-tag { background: white; color: var(--violet); }
  .stream.commission { background: var(--coral); color: white; }
  .stream.commission .stream-tag { background: white; color: var(--coral); }

  /* ─── Traction (done vs roadmap) ─────────────────────────────────────── */
  .trax-grid { display: grid; grid-template-columns: 1fr; gap: 48px; }
  @media (min-width: 820px) { .trax-grid { grid-template-columns: 1fr 1fr; } }
  .trax-col h3 { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .trax-col .marker { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: white; font-size: 12px; font-weight: 800; }
  .trax-col.done .marker { background: var(--success); }
  .trax-col.roadmap .marker { background: var(--coral); }
  .trax-list { list-style: none; padding: 0; margin: 0; }
  .trax-list li { padding: 12px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; color: var(--fg); display: flex; gap: 10px; }
  .trax-list li:last-child { border-bottom: none; }
  .trax-col.done li::before { content: "✓"; color: var(--success); font-weight: 800; flex: 0 0 20px; }
  .trax-col.roadmap li::before { content: "→"; color: var(--coral); font-weight: 800; flex: 0 0 20px; }
  .trax-list .quarter { font-weight: 700; font-size: 11px; letter-spacing: 0.08em; color: var(--coral); margin-right: 4px; }

  /* ─── Dashboard financials ───────────────────────────────────────────── */
  .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 22px;
    box-shadow: var(--shadow-sm);
  }
  .kpi-label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 8px; }
  .kpi-value { font-size: 32px; font-weight: 900; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .kpi-value.violet { color: var(--violet); }
  .kpi-value.coral { color: var(--coral); }
  .kpi-value.success { color: var(--success); }
  .kpi-sub { font-size: 12px; color: var(--fg-soft); margin-top: 6px; }
  .chart-row { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 820px) { .chart-row { grid-template-columns: 1fr 1fr; } }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  .chart-title { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 4px; }
  .chart-h { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .assumptions {
    margin-top: 24px;
    padding: 18px 22px;
    background: color-mix(in oklab, var(--violet) 10%, var(--surface));
    border: 1px solid color-mix(in oklab, var(--violet) 30%, var(--border-color));
    border-radius: 14px;
    font-size: 13px;
    color: var(--fg);
    line-height: 1.55;
  }
  .assumptions strong { color: var(--violet); font-weight: 700; }

  /* ─── Year toggle ────────────────────────────────────────────────────── */
  .year-toggle {
    display: inline-flex; gap: 4px; padding: 4px;
    background: var(--surface); border: 1px solid var(--border-color);
    border-radius: 999px; margin-bottom: 32px;
  }
  .year-btn {
    padding: 8px 18px; border-radius: 999px; background: transparent;
    border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--fg-soft); transition: all .15s;
  }
  .year-btn:hover { color: var(--fg); }
  .year-btn.active { background: var(--violet); color: white; }

  /* ─── Team ───────────────────────────────────────────────────────────── */
  .team-grid { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: start; }
  @media (min-width: 820px) { .team-grid { grid-template-columns: 1fr 1fr; } }
  .founder-card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-md);
  }
  .founder-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--violet) 0%, var(--violet-deep) 100%);
    display: grid; place-items: center;
    color: white; font-size: 28px; font-weight: 900; letter-spacing: -0.03em;
    margin-bottom: 20px;
  }
  .founder-card h3 { font-size: 24px; font-weight: 800; }
  .founder-role { font-size: 13px; font-weight: 700; color: var(--coral); margin-top: 4px; }
  .founder-org { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
  .founder-bio { list-style: none; padding: 0; margin: 24px 0 0; }
  .founder-bio li { font-size: 14px; color: var(--fg); padding: 8px 0; display: flex; gap: 10px; line-height: 1.4; }
  .founder-bio li::before { content: "→"; color: var(--violet); font-weight: 700; flex: 0 0 16px; }
  .hires-list { display: flex; flex-direction: column; gap: 10px; }
  .hire-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 14px;
  }
  .hire-row:hover { border-color: var(--violet-soft); }
  .hire-role { font-size: 14px; font-weight: 700; }
  .hire-skill { font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
  .hire-salary { font-size: 13px; font-weight: 800; color: var(--coral); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ─── Ask section (ink) ──────────────────────────────────────────────── */
  .ask-amount { font-size: clamp(80px, 15vw, 180px); font-weight: 900; letter-spacing: -0.055em; line-height: 0.95; color: white; margin: 20px 0 10px; }
  .ask-terms { font-size: 16px; color: var(--violet-soft); margin-bottom: 56px; }
  .funds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .fund-card {
    background: var(--violet-deep);
    border-radius: 18px; padding: 24px;
  }
  .fund-card .pct { font-size: 44px; font-weight: 900; color: var(--coral); line-height: 1; letter-spacing: -0.03em; }
  .fund-card .label { font-size: 15px; font-weight: 700; color: white; margin-top: 10px; }
  .fund-card .desc { font-size: 12px; color: rgba(255,255,255,0.68); margin-top: 6px; line-height: 1.5; }

  /* ─── Vision (violet) ────────────────────────────────────────────────── */
  .vision-h {
    font-size: clamp(44px, 7vw, 88px);
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -0.045em;
    margin: 40px 0 32px;
  }
  .vision-numbers {
    font-size: 15px; font-weight: 700; opacity: 0.95;
    max-width: 70ch; line-height: 1.5;
  }
  .vision-exit { margin-top: 24px; font-size: 13px; opacity: 0.78; }

  /* ─── Contact ────────────────────────────────────────────────────────── */
  .contact-card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 44px 32px;
    text-align: center;
    box-shadow: var(--shadow-md);
    max-width: 600px;
    margin: 0 auto;
  }
  .contact-h { font-size: clamp(44px, 7vw, 72px); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 8px; }
  .contact-ask { font-size: 20px; color: var(--coral); font-weight: 600; margin-bottom: 28px; }
  .contact-line { font-size: 14px; color: var(--fg-soft); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .contact-line.strong { font-size: 16px; color: var(--fg); font-weight: 700; margin-bottom: 10px; }
  .contact-copy {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; border: 1px solid var(--border-color);
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
    color: var(--fg-soft); margin-top: 20px;
    transition: all .15s;
  }
  .contact-copy:hover { color: var(--violet); border-color: var(--violet); }
  .contact-copy.copied { color: var(--success); border-color: var(--success); }

  footer {
    padding: 40px 20px;
    text-align: center;
    font-size: 11px;
    color: var(--fg-muted);
    border-top: 1px solid var(--border-color);
  }

  /* Recharts tweaks for theming */
  .recharts-text { fill: var(--fg-soft); font-family: 'Inter', sans-serif; font-size: 11px; }
  .recharts-cartesian-grid line { stroke: var(--border-color); stroke-dasharray: 2 4; }
  .recharts-tooltip-wrapper { outline: none; }
  .custom-tooltip {
    background: var(--surface-elev);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: var(--shadow-md);
    font-size: 12px;
  }
  .custom-tooltip .tt-label { color: var(--fg-muted); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .custom-tooltip .tt-value { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }

  :focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 4px; }
</style>

/* ═══════ Nav with theme toggle ═══════ */
function Nav() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('meto-theme') || 'auto'; } catch { return 'auto'; }
  });
  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'dark') root.setAttribute('data-theme', 'dark');
    else if (theme === 'light') root.setAttribute('data-theme', 'light');
    else root.removeAttribute('data-theme');
    try { localStorage.setItem('meto-theme', theme); } catch {}
  }, [theme]);

  const sections = [
    ["problema", "Problema"],
    ["producto", "Producto"],
    ["mercado", "Mercado"],
    ["financials", "Financials"],
    ["ask", "Ask"],
  ];

  return (<nav className="nav">
      <div className="nav-brand"><LogoMini  /> MeTo</div>
      <div className="nav-sections">
        {sections.map(([id, label]) => (<a key={id} href={'#' + id}>{label}</a>))}
      </div>
      <button className="theme-toggle" onClick={() => setTheme(t => t === 'dark' ? 'light' : (t === 'light' ? 'auto' : 'dark'))}>
        {theme === 'dark' ? '🌙 dark' : theme === 'light' ? '☀ light' : '◐ auto'}
      </button>
    </nav>);
}

/* ═══════ Interactive phone demo ═══════ */
function PhoneDemo() {
  const screens = [
    { key: "auth", label: "Login" },
    { key: "feed", label: "Feed" },
    { key: "match", label: "Match" },
    { key: "chat", label: "Chat" },
    { key: "sell", label: "Publicar" },
    { key: "profile", label: "Perfil" },
  ];
  const [idx, setIdx] = useState(0);
  const touchStartX = useRef(null);

  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t = setInterval(() => setIdx(i => (i + 1) % screens.length), 4000);
    return () => clearInterval(t);
  }, []);

  const handleTouchStart = e => { touchStartX.current = e.touches[0].clientX; };
  const handleTouchEnd = e => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 40) {
      setIdx(i => (i + (dx < 0 ? 1 : screens.length - 1)) % screens.length);
    }
    touchStartX.current = null;
  };

  return (<div>
      <div className="phone-wrap">
        <div className="phone" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
          <div className="phone-screen">
            {screens.map((s, i) => (<img key={s.key} src={MOCKUPS[s.key]} alt={s.label} className={i === idx ? 'active' : ''}  />))}
          </div>
        </div>
      </div>
      <div className="demo-controls">
        {screens.map((s, i) => (<button key={s.key} className={'demo-dot' + (i === idx ? ' active' : '')} onClick={() => setIdx(i)} aria-label={'Ver ' + s.label}></button>))}
      </div>
    </div>);
}
